<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>РАДИО ПыЛь_ДоРоГ FM</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #eeeeee;
            color: #222;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .welcome-screen {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 40px 20px 70px;
            overflow: hidden;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.15),
                    rgba(255, 255, 255, 0.25)
                ),
                url("radio-studio.png") center center / cover no-repeat,
                #e8e8e8;
        }

        .welcome-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background: radial-gradient(
                ellipse at center,
                rgba(255, 255, 255, 0.08) 5%,
                rgba(255, 255, 255, 0.3) 100%
            );
        }

        .on-air {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 18px;
            border: 1px solid rgba(220, 35, 35, 0.65);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.88);
            color: #d71919;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.12);
        }

        .on-air-dot {
            width: 9px;
            height: 9px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #ff2020;
            box-shadow: 0 0 8px #ff2020;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }
        }

        .welcome-title {
            max-width: 600px;
            margin: 0;
            color: #292929;
            font-size: clamp(30px, 7vw, 54px);
            font-weight: 900;
            text-align: center;
            line-height: 1.2;
            overflow-wrap: anywhere;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.15),
                0 0 15px rgba(255, 255, 255, 0.8);
        }

        .radio-subtitle {
            margin-top: -12px;
            color: #7a2020;
            font-size: 13px;
            letter-spacing: 3px;
            line-height: 1.6;
            text-align: center;
            text-shadow: 0 1px 5px rgba(255, 255, 255, 0.8);
        }

        .version-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            min-height: 64px;
            padding: 16px 22px;

            border: 2px solid #777777;
            border-radius: 50px;

            background: linear-gradient(
                145deg,
                #dedede,
                #a0a0a0
            );
            color: #202020;

            font-size: 16px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.22),
                inset 0 1px 3px rgba(255, 255, 255, 0.8);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .version-button:hover {
            transform: scale(1.03);

            background: linear-gradient(
                145deg,
                #eeeeee,
                #b8b8b8
            );

            box-shadow: 0 7px 22px rgba(0, 0, 0, 0.3);
        }

        .version-button:active {
            transform: scale(0.98);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10;

            display: flex;
            align-items: center;

            width: 100%;
            min-height: 38px;
            padding: 8px 14px;

            border-top: 1px solid rgba(0, 0, 0, 0.12);
            background: rgba(245, 245, 245, 0.94);
            backdrop-filter: blur(10px);
        }

        .author {
            color: #444444;
            font-size: 11px;
            text-decoration: none;
        }

        .author:hover {
            color: #c82020;
        }

        @media (max-height: 520px) {
            .welcome-screen {
                gap: 14px;
                padding-top: 20px;
                padding-bottom: 50px;
            }

            .welcome-title {
                font-size: 30px;
            }

            .radio-subtitle {
                margin-top: -8px;
            }

            .version-button {
                min-height: 52px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .on-air-dot {
                animation: none;
            }

            .version-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="welcome-screen">

        <div class="on-air">
            <span class="on-air-dot"></span>
            ON AIR
        </div>

        <h1 class="welcome-title">
            РАДИО<br>
            ПыЛь_ДоРоГ FM
        </h1>

        <div class="radio-subtitle">
            Твоя музыка — твоя волна
        </div>

        <a
            class="version-button"
            href="https://m.vk.ru/app54612661"
            target="_blank"
            rel="noopener noreferrer">
            📱 МОБИЛЬНАЯ ВЕРСИЯ
        </a>

    </main>

    <footer class="bottom-bar">
        <a
            class="author"
            href="https://vk.ru/muzer_play"
            target="_blank"
            rel="noopener noreferrer">
            Автор приложения
        </a>
    </footer>

    <script>
        if (window.vkBridge) {
            vkBridge.send('VKWebAppInit').catch(function(error) {
                console.error('Ошибка VK Bridge:', error);
            });
        }
    </script>

</body>
</html>
