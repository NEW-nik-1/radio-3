<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volnorez VK Mini App</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Сайт занимает всё место ДО нижней полоски */
        #volnorez {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: calc(100vh - 28px);

            border: none;
            display: block;
        }

        /* Нижняя серая полоска */
        .bottom-bar {
            position: fixed;
            left: 0;
            bottom: 0;

            width: 100%;
            height: 28px;

            background: #555;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            box-sizing: border-box;
            padding-left: 10px;
        }

        /* Автор приложения */
        .author {
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: 400;
            text-decoration: none;

            color: transparent;

            background: linear-gradient(
                90deg,
                #aaa,
                #fff,
                #aaa,
                #fff,
                #aaa
            );

            background-size: 300% 100%;

            -webkit-background-clip: text;
            background-clip: text;

            animation: wave 3s linear infinite;

            cursor: pointer;
        }

        @keyframes wave {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 300% 50%;
            }
        }
    </style>
</head>

<body>

    <iframe
        id="volnorez"
        src="https://m.volnorez.com/pyl_dorog-fm">
    </iframe>

    <div class="bottom-bar">
        <a
            class="author"
            href="https://vk.ru/muzer_play"
            target="_blank"
            rel="noopener noreferrer">
            Автор приложения
        </a>
    </div>

    <script>
        async function initApp() {
            try {
                await vkBridge.send('VKWebAppInit');
                console.log('VK Bridge инициализирован');
            } catch (e) {
                console.error('Ошибка VK Bridge:', e);
            }
        }

        initApp();
    </script>

</body>
</html>
