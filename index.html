<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volnorez VK Mini App</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #volnorez {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Автор приложения */
        .author {
            position: fixed;
            left: 8px;
            bottom: 6px;
            z-index: 9999;

            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: 400;
            text-decoration: none;

            color: transparent;
            background: linear-gradient(
                90deg,
                #888,
                #fff,
                #888,
                #fff,
                #888
            );
            background-size: 300% 100%;

            -webkit-background-clip: text;
            background-clip: text;

            animation: wave 3s linear infinite;

            opacity: 0.75;
            cursor: pointer;

            padding: 3px 5px;
        }

        @keyframes wave {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 300% 50%;
            }
        }

        .author:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <iframe
        id="volnorez"
        src="https://m.volnorez.com/pyl_dorog-fm">
    </iframe>

    <!-- Нажатие открывает сайт -->
    <a
        class="author"
        href="https://vk.ru/muzer_play"
        target="_blank"
        rel="noopener noreferrer">
        Автор приложения
    </a>

    <script>
        async function initApp() {
            try {
                await vkBridge.send('VKWebAppInit');
                console.log('VK Bridge инициализирован');
            } catch (e) {
                console.error('Ошибка VK Bridge:', e);
            }
        }

        initApp();
    </script>

</body>
</html>
