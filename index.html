<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUZER play VK Mini App</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Радио занимает всё место до нижней полоски */
        #volnorez {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 28px);
            border: none;
            display: block;
        }

        /* Контейнер лампочек сверху */
        .lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10000;
            pointer-events: none;
            overflow: hidden;
        }

        /* Маленькие светящиеся лампочки */
        .light {
            width: 5px;
            height: 5px;
            min-width: 5px;
            border-radius: 50%;
            opacity: 0.3;
            animation: blink 1.2s infinite alternate ease-in-out;
        }

        /* Красные лампочки */
        .light:nth-child(4n + 1) {
            background: #ff3030;
            box-shadow: 0 0 6px 2px #ff3030;
            animation-delay: 0s;
        }

        /* Зелёные лампочки */
        .light:nth-child(4n + 2) {
            background: #00ff88;
            box-shadow: 0 0 6px 2px #00ff88;
            animation-delay: 0.3s;
        }

        /* Синие лампочки */
        .light:nth-child(4n + 3) {
            background: #00bfff;
            box-shadow: 0 0 6px 2px #00bfff;
            animation-delay: 0.6s;
        }

        /* Жёлтые лампочки */
        .light:nth-child(4n) {
            background: #ffea00;
            box-shadow: 0 0 6px 2px #ffea00;
            animation-delay: 0.9s;
        }

        /* Анимация мигания */
        @keyframes blink {
            0% {
                opacity: 0.25;
                transform: scale(0.7);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Нижняя серая полоска */
        .bottom-bar {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 28px;
            background: #262626;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            padding-left: 10px;
        }

        /* Автор приложения */
        .author {
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: 400;
            text-decoration: none;
            color: transparent;
            background: linear-gradient(
                90deg,
                #aaa,
                #fff,
                #aaa,
                #fff,
                #aaa
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: wave 3s linear infinite;
            cursor: pointer;
        }

        /* Переливающийся текст автора */
        @keyframes wave {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 300% 50%;
            }
        }
    </style>
</head>

<body>

    <!-- Разноцветные мигающие лампочки -->
    <div class="lights" aria-hidden="true">
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
    </div>

    <!-- Радиостанция -->
    <iframe
        id="volnorez"
        src="https://m.volnorez.com/pyl_dorog-fm"
        title="Радио Volnorez"
        allow="autoplay"
        loading="eager">
    </iframe>

    <!-- Нижняя полоска с автором -->
    <div class="bottom-bar">
        <a
            class="author"
            href="https://vk.ru/muzer_play"
            target="_blank"
            rel="noopener noreferrer">
            Автор приложения
        </a>
    </div>

    <!-- Инициализация VK Bridge -->
    <script>
        async function initApp() {
            try {
                await vkBridge.send('VKWebAppInit');
                console.log('VK Bridge инициализирован');
            } catch (e) {
                console.error('Ошибка VK Bridge:', e);
            }
        }

        initApp();
    </script>

</body>
</html>
